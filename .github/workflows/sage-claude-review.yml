name: "SAGE Claude Code Review"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-review') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@de8e0b9c42c6cb58e904c857f164aa072244c1ac
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pinned action's default model (claude-sonnet-4-20250514) was retired
          # from the API (404), so the model must be set explicitly.
          model: claude-sonnet-5
          direct_prompt: |
            You are the SAGE Review Agent. Review this PR against SAGE principles.

            Check the following in order:

            1. **Spec Alignment**: Does this PR reference a SPEC-ID? Do changes match the spec?
            2. **Responsibility Alignment**: Are changes within the assigned layer's responsibility?
            3. **File Scope**: Are all changed files within the TASK's permitted scope?
            4. **Complexity**: Any unnecessary abstractions or over-engineering?
            5. **Test Adequacy**: Are normal, boundary, and error cases covered?
            6. **Safety**: Any security concerns (secrets, injection, auth)?
            7. **Anti-Patterns**: Check against SAGE anti-patterns:
               - Vibe Merge (no quality gate pass)
               - Big Bang Prompt (>20 files without TASK-ID)
               - Silent Scope Expansion (changes outside scope)
               - AI Monolith (all roles in one agent)
               - Invisible Development (no traceability)

            Reference: CLAUDE.md, sage/governance.md, sage/anti-patterns.md

            ## Output format rules (MUST follow)

            At the very end of your review, output a verdict line in this exact format:
            総合判定: ✅ PASS
            or
            総合判定: ❌ FAIL

            For each check item, use these icons consistently:
            - ✅ = PASS (no issue found)
            - ❌ = FAIL (issue found, must fix)
            - ⏭️ = SKIP (not applicable to this PR)

            NEVER use ❌ to mean "not detected" or "not applicable".
            ❌ means ONLY "a problem was found".

            For Anti-Patterns section, use this format:
            - ✅ Vibe Merge: 該当なし
            - ❌ Big Bang Prompt: 検出 — 25ファイルが単一コミットで変更
            NOT this format:
            - ❌ Vibe Merge: 該当なし  (WRONG — ❌ implies failure)

            IMPORTANT: Do NOT report CI Gate status (Gate 1-5 pass/fail).
            Gate status is reported by the gate workflows themselves.
            Your job is code review only — spec alignment, responsibility,
            file scope, complexity, test adequacy, safety, anti-patterns.
            Never include a "Gate状況分析" section in your output.

            Provide feedback in Japanese.
          timeout_minutes: 10

      - name: Check review verdict
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Wait briefly for the review comment to be posted
            await new Promise(r => setTimeout(r, 5000));

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 50,
            });

            // Find the most recent comment from the Claude review bot
            const reviewComment = comments
              .reverse()
              .find(c =>
                c.user?.type === 'Bot' &&
                (c.body || '').includes('総合判定')
              );

            // TASK-0073: fail-close. Missing comment or unparseable verdict
            // must FAIL the gate, not silently pass. A review bot that does
            // not respond or does not follow the required format cannot
            // serve as a gate.
            if (!reviewComment) {
              core.setFailed('SAGE Review Agent did not post a verdict comment within the timeout. Gate cannot pass without review.');
              return;
            }

            const body = reviewComment.body || '';

            // TASK-0073 follow-up: parse the verdict on the 総合判定 line
            // specifically. Earlier version matched ❌/✅ anywhere in the body,
            // which produced false FAILs when the bot's output included ❌
            // inside unrelated content such as the anti-pattern checklist
            // (e.g. "❌ Big Bang Prompt: 検出").
            //
            // TASK-0112 (Codex review P1 #2) follow-up: an earlier version
            // picked the FIRST line containing 総合判定, which matched
            // checklist items like "- [x] 総合判定の決定" before reaching the
            // actual verdict heading "### 総合判定: ✅ PASS". Now we filter
            // to lines that contain BOTH the keyword AND a marker.
            const verdictLines = body.split('\n').filter(l =>
              l.includes('総合判定') && (l.includes('✅') || l.includes('❌'))
            );
            if (verdictLines.length === 0) {
              core.setFailed('SAGE Review Agent did not emit a 総合判定 line with a ✅/❌ marker. Bot may have deviated from the required format.');
            } else {
              // Use the LAST marked verdict line — bots sometimes emit a
              // preliminary status before the final one.
              const verdictLine = verdictLines[verdictLines.length - 1];
              if (verdictLine.includes('❌')) {
                core.setFailed('SAGE Review Agent verdict: FAIL — see PR comments for details');
              } else {
                core.info('SAGE Review Agent verdict: PASS');
              }
            }
