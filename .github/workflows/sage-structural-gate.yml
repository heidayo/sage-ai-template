name: "SAGE Gate 1: Structural"

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'sage/**'
      - 'specs/**'
      - 'plans/**'
      - 'tasks/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Lint ---
      # Uncomment and configure for your language:
      #
      # Go:
      # - name: Setup Go
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version-file: go.mod
      # - name: Run golangci-lint
      #   uses: golangci/golangci-lint-action@v6
      #
      # Node.js:
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version-file: '.node-version'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Lint
      #   run: npm run lint
      # - name: Type check
      #   run: npm run type-check
      # - name: Format check
      #   run: npx prettier --check .
      #
      # Python:
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      # - name: Lint
      #   run: |
      #     pip install ruff mypy
      #     ruff check .
      #     mypy .

      - name: SAGE structure validation
        run: bash scripts/sage-validate.sh

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- sage-structural-gate -->';
            const status = '${{ job.status }}';
            const title = status === 'success'
              ? '✅ SAGE Gate 1 (Structural): PASS'
              : '❌ SAGE Gate 1 (Structural): FAIL';

            const body = [
              marker,
              `## ${title}`,
              '',
              `- Status: **${status}**`,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
              `- Updated: ${new Date().toISOString()}`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };

            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.payload.pull_request.number });
            }
