name: "SAGE Gate 1: Structural"

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'sage/**'
      - 'specs/**'
      - 'plans/**'
      - 'tasks/**'
    # CLAUDE.md / AGENTS.md / install.sh / templates/ / .sage/runs/ are
    # intentionally included so that Sprint 1 checks (doc-drift,
    # installer-reproduce, runlog-validate) can detect their respective
    # drift triggers.

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Validate the PR head commit directly to avoid shallow merge-ref
          # false positives in git diff-tree --check.
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep the direct parent so git diff-tree can inspect only the
          # current commit instead of treating HEAD as a synthetic root.
          fetch-depth: 2

      # --- Lint ---
      # Uncomment and configure for your language:
      #
      # Go:
      # - name: Setup Go
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version-file: go.mod
      # - name: Run golangci-lint
      #   uses: golangci/golangci-lint-action@v6
      #
      # Node.js:
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version-file: '.node-version'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Lint
      #   run: npm run lint
      # - name: Type check
      #   run: npm run type-check
      # - name: Format check
      #   run: npx prettier --check .
      #
      # Python:
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      # - name: Lint
      #   run: |
      #     pip install ruff mypy
      #     ruff check .
      #     mypy .

      - name: Run project checks from .sage/config.yaml
        id: project_checks
        run: |
          run_config_command() {
            local cmd="$1"
            local script
            local rc=0
            script=$(mktemp)
            {
              echo '#!/usr/bin/env bash'
              echo 'set -euo pipefail'
              printf '%s\n' "$cmd"
            } > "$script"
            chmod +x "$script"
            if bash "$script"; then
              rc=0
            else
              rc=$?
            fi
            rm -f "$script"
            return "$rc"
          }

          CONFIG=".sage/config.yaml"

          # Validate config file exists and is parseable
          if [ ! -f "$CONFIG" ]; then
            echo "INFO: $CONFIG not found. All project checks SKIPPED."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! yq '.' "$CONFIG" > /dev/null 2>&1; then
            echo "CONFIG ERROR: $CONFIG parse failed (invalid YAML)"
            exit 1
          fi

          FAILED=0

          # --- Lint ---
          LINT_CMD=$(yq -r '.project_checks.lint // ""' "$CONFIG" 2>/dev/null || echo "")
          if [ -n "$LINT_CMD" ]; then
            echo "--- Running lint: $LINT_CMD ---"
            if run_config_command "$LINT_CMD"; then
              echo "PASS: lint"
            else
              echo "FAIL: lint"
              FAILED=1
            fi
          else
            echo "SKIPPED: lint not configured in $CONFIG"
          fi

          # --- Format ---
          FORMAT_CMD=$(yq -r '.project_checks.format // ""' "$CONFIG" 2>/dev/null || echo "")
          if [ -n "$FORMAT_CMD" ]; then
            echo "--- Running format: $FORMAT_CMD ---"
            if run_config_command "$FORMAT_CMD"; then
              echo "PASS: format"
            else
              echo "FAIL: format"
              FAILED=1
            fi
          else
            echo "SKIPPED: format not configured in $CONFIG"
          fi

          # --- Type check ---
          TYPE_CHECK_CMD=$(yq -r '.project_checks.type_check // ""' "$CONFIG" 2>/dev/null || echo "")
          if [ -n "$TYPE_CHECK_CMD" ]; then
            echo "--- Running type_check: $TYPE_CHECK_CMD ---"
            if run_config_command "$TYPE_CHECK_CMD"; then
              echo "PASS: type_check"
            else
              echo "FAIL: type_check"
              FAILED=1
            fi
          else
            echo "SKIPPED: type_check not configured in $CONFIG"
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more project checks failed."
            exit 1
          fi

      - name: SAGE structure validation
        run: bash scripts/sage-validate.sh

      # SPEC-0008 Track C: consistency checks wired into Gate 1. Each script
      # is fail-close by default but SKIPs when its precondition is absent
      # (template file missing, .claude/ not installed, etc.).
      - name: RUN log schema validation (TASK-0074)
        run: bash scripts/sage-runlog-validate.sh

      - name: CLAUDE.md / AGENTS.md drift check (TASK-0077)
        run: bash scripts/sage-doc-drift.sh

      - name: install.sh reproducibility check (TASK-0078)
        run: bash scripts/sage-installer-reproduce.sh

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- sage-structural-gate -->';
            const status = '${{ job.status }}';
            const configured = '${{ steps.project_checks.outputs.configured }}';

            let icon, label;
            if (status === 'success' && configured !== 'true') {
              icon = '⏭️'; label = 'SKIPPED';
            } else if (status === 'success') {
              icon = '✅'; label = 'PASS';
            } else {
              icon = '❌'; label = 'FAIL';
            }

            const checksNote = configured !== 'true'
              ? '- Project checks: **SKIPPED** (not configured in .sage/config.yaml)'
              : `- Project checks: **${status === 'success' ? 'PASS' : 'FAIL'}**`;

            const body = [
              marker,
              `## ${icon} SAGE Gate 1 (Structural): ${label}`,
              '',
              checksNote,
              `- SAGE validation: **${status === 'success' ? 'PASS' : 'CHECK LOGS'}**`,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
              `- Updated: ${new Date().toISOString()}`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };

            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.payload.pull_request.number });
            }
