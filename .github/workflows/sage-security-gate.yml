name: "SAGE Gate 3: Security"

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # --- Secret Scan ---
      - name: Secret detection (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # --- Dependency Vulnerability Scan ---
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          format: json
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: trivy-fs.json

      - name: Create Trivy summary
        id: trivy
        run: |
          set -euo pipefail
          COUNT=$(jq '.Results | map(.Vulnerabilities // []) | flatten | length' trivy-fs.json 2>/dev/null || echo 0)
          CRITICAL=$(jq '[.Results | map(.Vulnerabilities // []) | flatten | .[] | select(.Severity == "CRITICAL")] | length' trivy-fs.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results | map(.Vulnerabilities // []) | flatten | .[] | select(.Severity == "HIGH")] | length' trivy-fs.json 2>/dev/null || echo 0)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No vulnerabilities found." > trivy-summary.md
          else
            jq -r '
              .Results | map(.Vulnerabilities // []) | flatten
              | sort_by(.Severity) | reverse | .[]
              | "- [\(.Severity)] \(.PkgName // "unknown") `\(.InstalledVersion // "?")` → `\(.FixedVersion // "none")` (\(.VulnerabilityID))"
            ' trivy-fs.json > trivy-summary.md
          fi

          # Fail on CRITICAL or HIGH vulnerabilities
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "FAIL: Found ${CRITICAL} CRITICAL and ${HIGH} HIGH vulnerabilities"
            exit 1
          fi

      - name: Upload Trivy report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: trivy-fs
          path: |
            trivy-fs.json
            trivy-summary.md

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- sage-security-gate -->';
            const status = '${{ job.status }}';
            const vulnCount = Number('${{ steps.trivy.outputs.count }}' || '0');

            const title = status === 'success'
              ? '✅ SAGE Gate 3 (Security): PASS'
              : '❌ SAGE Gate 3 (Security): FAIL';

            const read = (p) => {
              try { return fs.readFileSync(p, 'utf8').trim(); }
              catch { return '(not found)'; }
            };

            const body = [
              marker,
              `## ${title}`,
              '',
              `- Secret scan: **${status === 'success' ? 'PASS' : 'CHECK LOGS'}**`,
              `- Vulnerabilities found: **${vulnCount}**`,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
              `- Updated: ${new Date().toISOString()}`,
              '',
              '<details><summary>Trivy Details</summary>',
              '',
              read('trivy-summary.md'),
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };

            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.payload.pull_request.number });
            }
