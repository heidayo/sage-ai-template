name: "SAGE Gate 2: Functional"

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/sage-functional-gate.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # --- Tests ---
      # Uncomment and configure for your language:
      #
      # Go:
      # - name: Setup Go
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version-file: go.mod
      # - name: Run tests
      #   run: make test
      #
      # Node.js:
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version-file: '.node-version'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Run tests
      #   run: npm test -- --coverage
      #
      # Python:
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      # - name: Run tests
      #   run: |
      #     pip install pytest pytest-cov
      #     pytest --cov=src --cov-report=term-missing

      - name: Run project test command from .sage/config.yaml
        id: test
        run: |
          run_config_command() {
            local cmd="$1"
            local script
            local rc=0
            script=$(mktemp)
            {
              echo '#!/usr/bin/env bash'
              echo 'set -euo pipefail'
              printf '%s\n' "$cmd"
            } > "$script"
            chmod +x "$script"
            if bash "$script"; then
              rc=0
            else
              rc=$?
            fi
            rm -f "$script"
            return "$rc"
          }

          CONFIG=".sage/config.yaml"

          # Validate config file exists and is parseable
          if [ ! -f "$CONFIG" ]; then
            echo "INFO: $CONFIG not found. test_command SKIPPED."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! yq '.' "$CONFIG" > /dev/null 2>&1; then
            echo "CONFIG ERROR: $CONFIG parse failed"
            exit 1
          fi

          TEST_CMD=$(yq -r '.project_checks.test_command // ""' "$CONFIG" 2>/dev/null || echo "")
          if [ -n "$TEST_CMD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "--- Running test_command: $TEST_CMD ---"
            run_config_command "$TEST_CMD"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: test_command not configured in $CONFIG"
          fi

      # SPEC-0008 TASK-0070: coverage threshold check.
      # Runs only when project_checks.coverage_command is configured.
      # Threshold comes from functional.unit_test_coverage (default 0.80).
      - name: Check coverage threshold
        id: coverage
        run: |
          CONFIG=".sage/config.yaml"
          COV_CMD=$(yq -r '.project_checks.coverage_command // ""' "$CONFIG" 2>/dev/null || echo "")
          THRESHOLD=$(yq -r '.functional.unit_test_coverage // 0.80' "$CONFIG" 2>/dev/null || echo "0.80")

          if [ -z "$COV_CMD" ]; then
            echo "coverage_configured=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: coverage_command not configured in $CONFIG"
            exit 0
          fi

          echo "coverage_configured=true" >> "$GITHUB_OUTPUT"
          echo "--- Running coverage_command: $COV_CMD ---"
          COV_OUTPUT=$(bash -c "$COV_CMD" || true)
          echo "$COV_OUTPUT"

          # Extract and compare via sage-coverage-parse.sh
          COMPARE_OUT=$(printf '%s' "$COV_OUTPUT" | bash scripts/sage-coverage-parse.sh "$THRESHOLD" 2>&1)
          COMPARE_RC=$?
          echo "$COMPARE_OUT"
          echo "coverage_result=$COMPARE_OUT" >> "$GITHUB_OUTPUT"
          echo "coverage_rc=$COMPARE_RC" >> "$GITHUB_OUTPUT"
          if [ "$COMPARE_RC" -ne 0 ]; then
            exit 1
          fi

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- sage-functional-gate -->';
            const status = '${{ job.status }}';
            const configured = '${{ steps.test.outputs.configured }}';

            let icon, label;
            if (status === 'success' && configured !== 'true') {
              icon = '⏭️'; label = 'SKIPPED';
            } else if (status === 'success') {
              icon = '✅'; label = 'PASS';
            } else {
              icon = '❌'; label = 'FAIL';
            }

            const testNote = configured !== 'true'
              ? '- Tests: **SKIPPED** (test_command not configured in .sage/config.yaml)'
              : `- Tests: **${status === 'success' ? 'PASS' : 'FAIL'}**`;

            const coverageConfigured = '${{ steps.coverage.outputs.coverage_configured }}';
            const coverageResult = '${{ steps.coverage.outputs.coverage_result }}';
            const coverageRc = '${{ steps.coverage.outputs.coverage_rc }}';
            let coverageNote;
            if (coverageConfigured !== 'true') {
              coverageNote = '- Coverage: **SKIPPED** (coverage_command not configured in .sage/config.yaml)';
            } else if (coverageRc === '0') {
              coverageNote = `- Coverage: **PASS** (${coverageResult})`;
            } else {
              coverageNote = `- Coverage: **FAIL** (${coverageResult})`;
            }

            const body = [
              marker,
              `## ${icon} SAGE Gate 2 (Functional): ${label}`,
              '',
              testNote,
              coverageNote,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
              `- Updated: ${new Date().toISOString()}`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };

            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.payload.pull_request.number });
            }
