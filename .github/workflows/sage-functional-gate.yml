name: "SAGE Gate 2: Functional"

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/sage-functional-gate.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Tests ---
      # Uncomment and configure for your language:
      #
      # Go:
      # - name: Setup Go
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version-file: go.mod
      # - name: Run tests
      #   run: make test
      #
      # Node.js:
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version-file: '.node-version'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Run tests
      #   run: npm test -- --coverage
      #
      # Python:
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      # - name: Run tests
      #   run: |
      #     pip install pytest pytest-cov
      #     pytest --cov=src --cov-report=term-missing

      - name: Run project test command from .sage/config.yaml
        id: test
        run: |
          CONFIG=".sage/config.yaml"

          # Validate config file exists and is parseable
          if [ ! -f "$CONFIG" ]; then
            echo "INFO: $CONFIG not found. test_command SKIPPED."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! yq '.' "$CONFIG" > /dev/null 2>&1; then
            echo "CONFIG ERROR: $CONFIG parse failed"
            exit 1
          fi

          TEST_CMD=$(yq -r '.project_checks.test_command // ""' "$CONFIG" 2>/dev/null || echo "")
          if [ -n "$TEST_CMD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "--- Running test_command: $TEST_CMD ---"
            eval "$TEST_CMD"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: test_command not configured in $CONFIG"
          fi

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- sage-functional-gate -->';
            const status = '${{ job.status }}';
            const configured = '${{ steps.test.outputs.configured }}';

            let icon, label;
            if (status === 'success' && configured !== 'true') {
              icon = '⏭️'; label = 'SKIPPED';
            } else if (status === 'success') {
              icon = '✅'; label = 'PASS';
            } else {
              icon = '❌'; label = 'FAIL';
            }

            const testNote = configured !== 'true'
              ? '- Tests: **SKIPPED** (test_command not configured in .sage/config.yaml)'
              : `- Tests: **${status === 'success' ? 'PASS' : 'FAIL'}**`;

            const body = [
              marker,
              `## ${icon} SAGE Gate 2 (Functional): ${label}`,
              '',
              testNote,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
              `- Updated: ${new Date().toISOString()}`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };

            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.payload.pull_request.number });
            }
