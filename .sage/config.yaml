# SAGE Runtime Configuration v0.1
# This file defines quality gate thresholds, metrics schemas, and runtime settings.

# --- Quality Gates ---
quality_gates:
  structural:
    lint: required
    format: required
    type_check: required
  functional:
    unit_test_coverage: 0.80  # 80% minimum
    integration_test: required
  security:
    secret_scan: required
    dependency_vuln: required
    sast: required
  architecture:
    layer_boundary: required
    traceability: required
  release:
    migration_safety: required
    rollback_plan: required
    monitoring_ready: required

# --- Metrics ---
metrics:
  cycle_time:
    measure: "SPEC作成からPRマージまでの時間（時間単位）"
    source: "GitHub API: issue created_at → PR merged_at"
    target_p50: "24h"
  gate_pass_rate:
    measure: "CIゲート初回通過率"
    source: "GitHub Actions: jobs結果"
    target: ">= 0.8"
  rework_rate:
    measure: "同一TASK-IDに対する再コミット率"
    source: "git log --grep=TASK-ID"
    target: "<= 0.2"
  code_churn:
    description: "PR内の追加行/削除行の比率"
    source: "git diff --numstat origin/main...HEAD"
    target: "<= 3.0"
  duplication_rate:
    description: "コード重複率"
    source: "duplication_check の出力"
    target: "<= 5%"

# --- Run Log Schema ---
run_log_schema:
  format: "yaml"
  location: ".sage/runs/{RUN-ID}.yaml"
  fields:
    run_id: "RUN-XXXX"
    task_id: "TASK-XXXX"
    agent_id: "spec | planning | implementation | review | test | security | operations"
    started_at: "ISO 8601"
    completed_at: "ISO 8601"
    status: "pass | fail | skipped"
    files_changed: []
    gate_results:
      structural: "pass | fail"
      functional: "pass | fail | skipped"
      security: "pass | fail"
      architecture: "pass | fail"
      release: "pass | fail | skipped"
    error_log: ""

# --- ID Schema ---
id_schema:
  spec: "SPEC-{4-digit sequential}"
  plan: "PLAN-{4-digit sequential}"
  task: "TASK-{4-digit sequential}"
  run: "RUN-{4-digit sequential}"
  fail: "FAIL-{4-digit sequential}"
  merge: "PR number from GitHub"

# --- Anti-Pattern Detection Thresholds ---
anti_pattern_detection:
  big_bang_prompt:
    signal: "Single commit touching >20 files without TASK-ID"
    max_files_per_commit: 20
  vibe_merge:
    signal: "PR merged without any quality gate passing"
  silent_scope_expansion:
    signal: "Changes to files outside TASK File Scope"
  invisible_development:
    signal: "Commits without TASK-ID in message"

# --- Harness Configuration ---
harness:
  max_iterations: 5               # Execute-Verify loop limit
  # SPEC-0008 TASK-0082: threshold 100 -> 95 で LLM 採点ブレに強くする。
  # ブレ対策は moving window (直近 N 回の最小値で判定) + best-of-N
  # (1 ラウンド M 回採点の最高値採用) の組合せ。実装は TASK-0083/0084。
  spec_score_threshold: 95         # Phase 1: Evaluator score to proceed
  plan_score_threshold: 95         # Phase 2: Evaluator score to proceed
  review_score_threshold: 95       # Phase 3-4: Review Agent score to pass
  scoring_window_size: 3           # 直近 N 回ラウンドの最小スコアで判定
  scoring_best_of_n: 3             # 1 ラウンドあたり M 回採点し最高値採用 (1 で旧挙動)
  scoring_variance_abort: 15       # best-of-N の max-min がこの値超で human escalation
  # 閾値未達 → verdict: FAIL → fix_scope に従いエージェント再実行
  # Hard Fail → retry_allowed: false → 即abort
  spec_eval_max_iterations: 10     # Phase 1: Evaluator loop limit
  plan_eval_max_iterations: 10     # Phase 2: Evaluator loop limit
  verify_pass_required: true       # All gates must pass
  enable_browser_verify: false     # Playwright MCP browser verification
  # abort_reason values: max_iterations | same_fail_3x | spec_eval_max | plan_eval_max | human_escalation | yaml_schema_error | scoring_oscillation | evaluator_unavailable
  # Failure accumulation (Knowledge Management)
  auto_append_failures: true       # Auto-append Verify Fail patterns to sage/failures.md
  same_fail_abort_threshold: 3     # Abort on same CHECK-ID failing 3 times consecutively
  failure_pattern_escalation: 3    # Escalate to sage/anti-patterns.md after 3 occurrences
  # Auto-approve mode: SPEC承認後、PLAN→TASK→Execute→Verify→ドキュメント更新まで
  # 人間の介入なしで完走する。SPECの最初の承認のみ人間が行う。
  #   false (default): 各フェーズでEvaluator採点→人間確認→次フェーズ
  #   true:            SPEC承認後はEvaluator 閾値到達で自動的に次フェーズへ進行
  auto_approve: false

# --- Project Checks (SPEC-0002: Gate Enforcement) ---
# Configure language-specific commands for CI gates.
# Uncomment and set commands for your project.
# If unset, the corresponding gate check will be SKIPPED (not faked as PASS).
project_checks:
  # lint: "npm run lint"                    # Gate 1: Lint check
  # format: "npx prettier --check ."       # Gate 1: Format check
  # type_check: "npx tsc --noEmit"         # Gate 1: Type check
  # test_command: "npm test"               # Gate 2: Test runner
  # Go example:
  #   lint: "golangci-lint run"
  #   format: "gofmt -l . | grep -c . && exit 1 || true"
  #   type_check: "go vet ./..."
  #   test_command: "go test ./... -coverprofile=coverage.out"
  # Python example:
  #   lint: "ruff check ."
  #   format: "black --check ."
  #   type_check: "mypy ."
  #   test_command: "pytest --cov=src --cov-report=term-missing"
  # --- AI生成コード品質チェック（オプション） ---
  # 有効化条件: Gate 1 が2週間安定運用後 / パッケージマネージャ使用プロジェクト
  # ロールバック: 誤検知率 > 5% or CI時間増加 > 30秒 → コメントアウトに戻す
  # hallucination_check: "bash scripts/check-package-existence.sh"
  # duplication_check: "npx jscpd --threshold 5 src/"
  # complexity_check: "npx escomplex-cli --maxcc 15 src/"

# --- Hooks (SPEC-0003: Hooks実用化) ---
# Profile controls which hooks are active.
# Aligned with SAGE adoption phases:
#   minimal  = Phase A (SessionStart + Stop only)
#   standard = Phase B (+ dangerous command block + SAGE file protection)
#   strict   = Phase C+ (+ File Scope check as block)
#   none     = All hooks disabled
hooks:
  profile: minimal
  # Upgrade conditions:
  #   minimal → standard: make report shows SESSIONS >= 10 and STATUS: HEALTHY
  #   standard → strict:  make report shows 2 weeks continuous HEALTHY

# --- Lanes (SPEC-0006: Vibe Coding Lanes & Promotion) ---
# Branch-name-based automatic lane selection.
# Each lane defines required gates and constraints.
lanes:
  explore:
    branch_pattern: "vibe/*"
    task_id_required: false
    spec_required: false
    gates: []
    # No enforcement — free exploration
  lite:
    branch_pattern: "fix/*,chore/*,docs/*"
    task_id_required: true
    spec_required: false
    max_files: 3
    contract_change_allowed: false  # API/DB/event schema changes prohibited
    gates: [structural, security]
    # Gate 1 (lint/format/type) + Gate 3 (secret/vuln) + targeted tests
  standard:
    branch_pattern: "feature/*,*"
    task_id_required: true
    spec_required: true
    gates: [structural, functional, security, architecture]
    # Full 7-phase lifecycle
  promotion:
    branch_pattern: "promote/*"
    task_id_required: true
    retro_spec_required: true
    gates: [structural, functional, security, architecture]
    # vibe/* → promote/* conversion with Retro-SPEC

# Lane override: set max commits before retro-spec warns about accuracy
promotion_max_commits: 50

# --- Auto Update ---
auto_update:
  installer_url: "https://gist.githubusercontent.com/heidayo/98c36fbaf41cc5170b071b21bde3bb51/raw/install.sh"
  check_interval: "daily"
